[project]
name = "ishtar-ml"
version = "0.1.0"
description = "Learned high-resolution topography of Venus from Magellan SAR"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy>=1.26"]

[project.optional-dependencies]
# The geo stack is only needed to ingest the real products; the model and the tests
# import it lazily or not at all.
data = ["rasterio>=1.3", "rioxarray", "zarr>=3", "dask", "xarray", "pyproj", "requests"]
train = ["hydra-core", "wandb", "lightning"]
dev = ["pytest>=8", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
