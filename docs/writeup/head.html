<title>Venus at 75 Metres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    /* Radar-plate palette. The ochre is Venus's own colour, from the cloud deck; the
       blue is reserved for measured quantities, the ochre for modelled ones. */
    --paper:        #e7e4dc;
    --plate:        #faf9f5;
    --ink:          #17150f;
    --ink-2:        #46433a;
    --muted:        #6d695e;
    --rule:         #c9c4b6;
    --rule-soft:    #dbd7cc;
    --modelled:     #c98500;
    --measured:     #1c5cab;
    --flag:         #a6401c;
    --good:         #2f6b45;

    --measure: 66ch;
    --wide: 62rem;

    --step--1: clamp(0.78rem, 0.76rem + 0.1vw, 0.84rem);
    --step-0:  clamp(1rem, 0.97rem + 0.15vw, 1.07rem);
    --step-1:  clamp(1.2rem, 1.1rem + 0.4vw, 1.4rem);
    --step-2:  clamp(1.5rem, 1.3rem + 0.9vw, 2rem);
    --step-3:  clamp(2.1rem, 1.6rem + 2.2vw, 3.4rem);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:     #131211;
      --plate:     #1b1a18;
      --ink:       #e8e4d9;
      --ink-2:     #b6b1a4;
      --muted:     #8e897c;
      --rule:      #35322c;
      --rule-soft: #272522;
      --modelled:  #c98500;
      --measured:  #3987e5;
      --flag:      #e2714a;
      --good:      #62b183;
    }
  }

  :root[data-theme="dark"] {
    --paper:     #131211;
    --plate:     #1b1a18;
    --ink:       #e8e4d9;
    --ink-2:     #b6b1a4;
    --muted:     #8e897c;
    --rule:      #35322c;
    --rule-soft: #272522;
    --modelled:  #c98500;
    --measured:  #3987e5;
    --flag:      #e2714a;
    --good:      #62b183;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 var(--step-0)/1.65 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    display: grid;
    grid-template-columns:
      [full-start] minmax(1.25rem, 1fr)
      [wide-start] minmax(0, calc((var(--wide) - var(--measure)) / 2))
      [text-start] minmax(0, var(--measure)) [text-end]
      minmax(0, calc((var(--wide) - var(--measure)) / 2)) [wide-end]
      minmax(1.25rem, 1fr) [full-end];
    row-gap: 1.5rem;
    padding: clamp(2.5rem, 6vw, 5rem) 0 6rem;
  }
  .page > * { grid-column: text; }
  .page > .wide { grid-column: wide; }

  h1, h2, h3 { font-family: "Zilla Slab", Georgia, serif; text-wrap: balance; margin: 0; }
  h1 { font-size: var(--step-3); font-weight: 700; letter-spacing: -0.015em; line-height: 1.02; }
  h2 {
    font-size: var(--step-2); font-weight: 600; line-height: 1.15;
    margin-top: 2.75rem; padding-top: 1.1rem; border-top: 1px solid var(--rule);
  }
  h3 { font-size: var(--step-1); font-weight: 600; margin-top: 1.75rem; }

  p { margin: 0 0 1.1rem; }
  p:last-child { margin-bottom: 0; }
  /* Grid siblings already get row-gap; a bottom margin on top of it doubles the space. */
  .page > p { margin-bottom: 0; }
  .lede { font-size: var(--step-1); line-height: 1.5; color: var(--ink-2); margin-top: 0.9rem; }

  .eyebrow {
    font: 500 var(--step--1)/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 0.9rem;
  }

  a { color: inherit; text-decoration-color: var(--modelled); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--measured); outline-offset: 3px; }

  strong { font-weight: 600; }
  code, .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.92em; }
  code { color: var(--ink-2); }

  /* Spec strip — the header block of a planetary data product. */
  .spec {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
    gap: 0.1rem 2rem; margin: 2rem 0 0;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    padding: 0.9rem 0;
  }
  .spec div { display: flex; flex-direction: column; gap: 0.15rem; padding: 0.3rem 0; }
  .spec dt, .spec .k {
    font: 400 var(--step--1)/1.2 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  .spec .v {
    font: 500 1.05rem/1.2 "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; margin: 1.4rem 0; }
  caption {
    caption-side: top; text-align: left; color: var(--muted);
    font: 400 var(--step--1)/1.5 "IBM Plex Mono", ui-monospace, monospace;
    padding-bottom: 0.7rem;
  }
  th, td { padding: 0.5rem 0.85rem 0.5rem 0; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; white-space: normal; }
  thead th {
    font: 500 var(--step--1)/1.3 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--rule); vertical-align: bottom;
  }
  tbody td { border-bottom: 1px solid var(--rule-soft); font-size: 0.95rem; }
  tbody tr:last-child td { border-bottom: 1px solid var(--rule); }
  tbody th {
    text-align: left; font-weight: 500; font-size: 0.95rem;
    border-bottom: 1px solid var(--rule-soft); padding: 0.5rem 0.85rem 0.5rem 0;
  }
  tr.highlight th, tr.highlight td { background: color-mix(in srgb, var(--modelled) 11%, transparent); }
  td.num, th.num { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  /* Status colours, deliberately not either series colour — a green "better" cell
     rendered in the raw-units blue would read as a series label. */
  .good { color: var(--good); font-weight: 500; }
  .bad  { color: var(--flag); font-weight: 500; }

  figure { margin: 1.75rem 0; }
  figure img { display: block; width: 100%; height: auto; border-radius: 2px; }
  .plate { background: var(--plate); border: 1px solid var(--rule); padding: 1rem; border-radius: 3px; }
  figcaption {
    margin-top: 0.8rem; color: var(--muted);
    font: 400 var(--step--1)/1.6 "IBM Plex Sans", sans-serif;
  }
  figcaption b { color: var(--ink-2); font-weight: 600; }

  .legend { display: flex; flex-wrap: wrap; gap: 1.1rem; margin: 0 0 0.35rem; }
  .legend code { font-size: inherit; color: inherit; }
  .legend span {
    display: inline-flex; align-items: center; gap: 0.45rem;
    font: 500 var(--step--1)/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.04em; color: var(--ink-2);
  }
  .swatch { width: 1.1rem; height: 0.2rem; border-radius: 1px; }

  .finding { margin: 1.75rem 0 0; }
  .finding h3 { margin-top: 0; }
  .finding .tag {
    font: 500 var(--step--1)/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--flag);
    display: block; margin-bottom: 0.4rem;
  }

  ul { padding-left: 1.15rem; margin: 0 0 1.1rem; }
  li { margin-bottom: 0.4rem; }
  li::marker { color: var(--muted); }

  .note {
    border-left: 2px solid var(--modelled); padding: 0.1rem 0 0.1rem 1.1rem;
    color: var(--ink-2); margin: 1.5rem 0;
  }

  footer {
    margin-top: 3.5rem; padding-top: 1.1rem; border-top: 1px solid var(--rule);
    color: var(--muted); font: 400 var(--step--1)/1.7 "IBM Plex Mono", ui-monospace, monospace;
  }

  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity 120ms;
    background: var(--ink); color: var(--paper); padding: 0.4rem 0.6rem; border-radius: 3px;
    font: 500 0.78rem/1.35 "IBM Plex Mono", ui-monospace, monospace; z-index: 10;
    white-space: pre;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
